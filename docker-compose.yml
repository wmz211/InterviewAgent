version: "3.9"

services:
  # ── Neo4j 5.x (Graph DB) ───────────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: interview_neo4j
    ports:
      - "7474:7474"     # Browser UI  → http://localhost:7474
      - "7687:7687"     # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/interviewagent123
      # Auto-download APOC plugin at first startup (requires internet)
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      # Memory tuning (adjust for your machine)
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache__size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s    # Neo4j needs time to download APOC on first run

  # ── FastAPI App ─────────────────────────────────────────────────
  api:
    build: .
    container_name: interview_api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    command: python -m app.main

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:
